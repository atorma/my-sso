apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  labels:
    app.kubernetes.io/name: oauth2-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oauth2-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oauth2-proxy
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oauth2-proxy
          # v7.15.6, pinned by the multi-arch index digest.
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6@sha256:c3415e8660af553f5e18f5d90db050614c02493c0ac6260ac59442f6d9b12048
          args:
            - --http-address=0.0.0.0:4180
            - --provider=google
            - --redirect-url=https://auth.atorma.fi/oauth2/callback
            # Allowlist: only the emails file. --email-domain is deliberately unset;
            # oauth2-proxy ORs it with the file, and "*" would admit every Google account.
            - --authenticated-emails-file=/etc/oauth2-proxy/allowed/emails.txt
            # Session: stateless encrypted cookie for the whole domain, 7 days, no refresh.
            - --session-store-type=cookie
            - --cookie-domain=.atorma.fi
            - --cookie-expire=168h
            - --cookie-samesite=lax
            - --cookie-secure=true
            - --cookie-httponly=true
            # Only redirect back to atorma.fi hosts after sign-in.
            - --whitelist-domain=.atorma.fi
            # Behind ingress-nginx: answer auth subrequests, go straight to Google.
            - --reverse-proxy=true
            - --upstream=static://202
            - --skip-provider-button=true
            - --silence-ping-logging=true
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secrets
                  key: client-id
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secrets
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secrets
                  key: cookie-secret
          ports:
            - name: http
              containerPort: 4180
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: allowed-emails
              mountPath: /etc/oauth2-proxy/allowed
              readOnly: true
      volumes:
        - name: allowed-emails
          secret:
            secretName: oauth2-proxy-allowed-emails
