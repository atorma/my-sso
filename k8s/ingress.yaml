apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oauth2-proxy
  annotations:
    # The OAuth callback sets a large session cookie; the default 4k buffer can
    # reject it with "upstream sent too big header".
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - auth.atorma.fi
      secretName: auth-atorma-fi-tls
  rules:
    - host: auth.atorma.fi
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: oauth2-proxy
                port:
                  name: http
